name: TDL end-validation observability PR2303 CI

on:
  pull_request:
    paths:
      - 'backend/src/modules/vehicle-intelligence/trips/trip-end-validation-observability*'
      - 'backend/src/modules/vehicle-intelligence/trips/testing/trip-r11-postgres-redis.integration.harness.ts'
      - 'backend/package.json'
      - 'architecture/trip-detection-lifecycle/evidence/TDL_END_VALIDATION_OBSERVABILITY_PR0_REPLAY_CONTRACT_V1.md'
      - '.github/workflows/tdl-end-validation-observability-pr2303.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public

jobs:
  install-lockfile:
    name: Install (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend

  tdl-observability-unit:
    name: TDL observability unit tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:tdl-end-validation-observability
        working-directory: backend

  tdl-observability-postgres:
    name: TDL observability Postgres integration
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: trip-tdl-obs-ci-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:tdl-end-validation-observability:postgres:ci
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRIP_END_VALIDATION_OBSERVABILITY_POSTGRES_INTEGRATION: '1'
          TRIP_END_VALIDATION_OBSERVABILITY_POSTGRES_REQUIRED: '1'
          TRIP_END_VALIDATION_OBSERVABILITY_MIGRATION_POSTGRES: '1'
          TRIP_END_VALIDATION_OBSERVABILITY_MIGRATION_POSTGRES_REQUIRED: '1'

  tdl-golden-fsm-parity:
    name: TDL golden FSM parity (Postgres+Redis)
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: trip-tdl-golden-ci-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:tdl-end-validation-observability:golden-parity:ci
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRIP_END_VALIDATION_GOLDEN_PARITY_POSTGRES_REDIS: '1'
          TRIP_END_VALIDATION_GOLDEN_PARITY_POSTGRES_REDIS_REQUIRED: '1'

  tdl-pr2303-ci-gate:
    name: TDL PR2303 CI gate
    needs:
      - tdl-observability-unit
      - tdl-observability-postgres
      - tdl-golden-fsm-parity
    runs-on: ubuntu-latest
    steps:
      - run: echo "TDL PR2303 observability unit + postgres + golden parity gates passed."
